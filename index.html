<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1c2a48">
  <title>의정부교회</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <svg class="cross" viewBox="0 0 24 32" aria-hidden="true"><path d="M10 0h4v10h8v4h-8v18h-4V14H2v-4h8z"/></svg>
    <h1>의정부교회 <em>포털</em></h1>
    <p class="sub">의정부교회 소식과 앱을 한곳에서</p>
    <div class="meta">
      <p class="stats" id="stats"></p>
      <p class="stats visit" id="visit">오늘 방문 0명</p>
    </div>
  </header>

  <nav class="tabs" aria-label="바로가기">
    <a href="#hero">주일말씀</a>
    <a href="#sec-0">교회 소식</a>
    <a href="#sec-1">성도 앱·사이트</a>
  </nav>

  <main>
    <section class="hero" id="hero">
      <div class="hero-media" id="hero-media"></div>
      <a class="hero-bar" id="hero-bar" href="#">
        <span class="hero-icon" id="hero-icon"></span>
        <span class="hero-text">
          <strong>주일말씀 <em>다시보기</em></strong>
          <small id="hero-sub">유튜브에서 바로 보기</small>
        </span>
      </a>
    </section>

    <div class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
      <input id="q" type="search" placeholder="메뉴 찾기 (예: 성경, 기도, 찬송)" aria-label="메뉴 찾기" autocomplete="off" enterkeyhint="search">
      <button type="button" id="q-clear" aria-label="검색어 지우기" hidden>&times;</button>
    </div>

    <div id="sections"></div>
    <p class="empty" id="empty" hidden>찾는 메뉴가 없어요. 다른 단어로 찾아 보세요.</p>
  </main>

  <footer>
    <p>의정부교회 통합 포털</p>
    <p class="total" id="total" hidden></p>
  </footer>

  <!-- 미리보기 창: 카드를 누르면 사진·영상이 먼저 보입니다 -->
  <div id="viewer" class="viewer" hidden>
    <div class="viewer-bg" data-close></div>
    <div class="viewer-panel" role="dialog" aria-modal="true" aria-labelledby="viewer-title">
      <button class="viewer-x" data-close aria-label="닫기">&times;</button>
      <div class="viewer-media" id="viewer-media"></div>
      <div class="viewer-info">
        <h2 id="viewer-title"></h2>
        <p id="viewer-desc"></p>
        <a id="viewer-go" class="go" href="#" target="_blank" rel="noopener noreferrer"></a>
        <div class="viewer-sub">
          <button type="button" data-share>공유</button>
          <button type="button" data-close>닫기</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
