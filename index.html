<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a3a7a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="의정부교회">
  <meta name="description" content="의정부교회 소식과 성도 앱·사이트를 한곳에서">
  <title>의정부교회</title>
  <link rel="icon" href="img/logo.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">

    <!-- 상단 바 -->
    <header class="appbar" id="appbar">
      <a class="brand" href="#top" aria-label="맨 위로">
        <img src="img/logo.png" alt="" width="40" height="38">
        <span class="brand-text">
          <strong>의정부교회</strong>
          <small id="today"></small>
        </span>
      </a>
      <button type="button" class="icon-btn" data-open-search aria-label="메뉴 찾기">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
      </button>
    </header>

    <main id="top">
      <!-- 인사 + 방문자 -->
      <section class="greet">
        <p class="greet-hi" id="greet">평안한 하루 되세요</p>
        <h1>오늘도 <em>말씀</em>과 함께해요</h1>
        <p class="visit" id="visit" hidden></p>
      </section>

      <!-- 올해 표어 -->
      <figure class="slogan">
        <img src="img/01.jpg" alt="2026 의정부교회 슬로건 — 열정, 열심, 열망으로 보내는 한 해. 부지런하여 게으르지 말고 열심을 품고 주를 섬기라 (롬 12:11)" width="800" height="404">
      </figure>

      <!-- 주일말씀 -->
      <section class="block" id="sermon">
        <div class="block-head">
          <h2>주일말씀</h2>
          <a class="more" id="sermon-more" href="#" target="_blank" rel="noopener noreferrer">채널 보기 ›</a>
        </div>
        <a class="yt" id="yt" href="#" target="_blank" rel="noopener noreferrer" aria-label="유튜브에서 주일말씀 보기 (새 창)">
          <span class="yt-thumb" id="yt-thumb">
            <img class="yt-bg" src="img/01.jpg" alt="">
            <span class="yt-cover" id="yt-cover">
              <img src="img/logo.png" alt="" width="44" height="42">
              <b>주일말씀</b>
              <small>다시보기</small>
            </span>
            <span class="yt-badge">
              <svg viewBox="0 0 28 20" aria-hidden="true"><rect width="28" height="20" rx="5" fill="#FF0000"/><path d="M11.2 5.8v8.4l7.2-4.2z" fill="#fff"/></svg>
              YouTube
            </span>
            <span class="yt-play" aria-hidden="true">
              <svg viewBox="0 0 68 48"><path d="M66.5 7.7a8.6 8.6 0 0 0-6-6C55.2.3 34 .3 34 .3s-21.2 0-26.5 1.4a8.6 8.6 0 0 0-6 6C.1 13 .1 24 .1 24s0 11 1.4 16.3a8.6 8.6 0 0 0 6 6C12.8 47.7 34 47.7 34 47.7s21.2 0 26.5-1.4a8.6 8.6 0 0 0 6-6C67.9 35 67.9 24 67.9 24s0-11-1.4-16.3z" fill="#FF0000"/><path d="M45 24 27 14v20z" fill="#fff"/></svg>
            </span>
            <span class="yt-date" id="yt-date" hidden></span>
          </span>
          <span class="yt-info">
            <img class="yt-avatar" src="img/logo.png" alt="" width="40" height="38">
            <span class="yt-text">
              <b id="yt-title">주일말씀 다시보기</b>
              <small><span id="yt-channel">의정부교회</span> · 유튜브에서 열려요</small>
            </span>
            <svg class="yt-out" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"/></svg>
          </span>
        </a>
      </section>

      <!-- 성도 앱·사이트 (빠른 메뉴) -->
      <section class="block" id="apps">
        <div class="block-head">
          <h2>성도 앱·사이트</h2>
          <span class="count" id="apps-count"></span>
        </div>
        <ul class="quick" id="quick"></ul>
      </section>

      <!-- 교회 소식 (옆으로 넘기기) -->
      <section class="block" id="news">
        <div class="block-head">
          <h2>교회 소식</h2>
          <span class="hint">옆으로 넘겨 보세요</span>
        </div>
        <ul class="carousel" id="carousel"></ul>
        <div class="dots" id="dots" aria-hidden="true"></div>
      </section>

      <footer>
        <img src="img/logo.png" alt="" width="28" height="27">
        <p>의정부교회 통합 포털</p>
        <p class="total" id="total" hidden></p>
      </footer>
    </main>

    <!-- 하단 탭 -->
    <nav class="tabbar" aria-label="바로가기">
      <a href="#top" data-tab="top" class="on">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11 12 4l8 7v9h-5v-6H9v6H4z"/></svg><span>홈</span>
      </a>
      <a href="#sermon" data-tab="sermon">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m10 9.5 5 2.5-5 2.5z"/></svg><span>말씀</span>
      </a>
      <a href="#apps" data-tab="apps">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.8"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.8"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.8"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.8"/></svg><span>앱·사이트</span>
      </a>
      <a href="#news" data-tab="news">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11v16H6a2 2 0 0 1-2-2V5z"/><path d="M16 8h4v10a2 2 0 0 1-4 0M8 8h5M8 12h5M8 16h3"/></svg><span>소식</span>
      </a>
      <button type="button" data-open-search>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><span>찾기</span>
      </button>
    </nav>
  </div>

  <!-- 메뉴 찾기 -->
  <div class="search-page" id="search" hidden role="dialog" aria-modal="true" aria-label="메뉴 찾기">
    <div class="search-top">
      <div class="search-field">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
        <input id="q" type="search" placeholder="성경, 기도, 찬송…" aria-label="메뉴 찾기" autocomplete="off" enterkeyhint="search">
        <button type="button" id="q-clear" aria-label="검색어 지우기" hidden>&times;</button>
      </div>
      <button type="button" class="search-cancel" data-close-search>닫기</button>
    </div>
    <div class="chips" id="chips"></div>
    <ul class="results" id="results"></ul>
    <p class="empty" id="empty" hidden>찾는 메뉴가 없어요.<br>다른 단어로 찾아 보세요.</p>
  </div>

  <!-- 미리보기 (아래에서 올라오는 창) -->
  <div id="viewer" class="viewer" hidden>
    <div class="viewer-bg" data-close></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="viewer-title" id="sheet">
      <div class="grab" id="grab" aria-hidden="true"><span></span></div>
      <div class="viewer-media" id="viewer-media"></div>
      <div class="viewer-info">
        <h2 id="viewer-title"></h2>
        <p id="viewer-desc"></p>
        <a id="viewer-go" class="go" href="#" target="_blank" rel="noopener noreferrer"></a>
        <div class="viewer-sub">
          <button type="button" data-share>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7.5 7.5 12 3l4.5 4.5M5 13v6h14v-6"/></svg>공유
          </button>
          <button type="button" data-close>닫기</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
